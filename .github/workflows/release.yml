name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # The bundle version comes from tauri.conf.json, not from the git tag.
      # Without this the release can be named v1.0.0 while shipping 0.1.0 binaries.
      - name: Sync version to tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Tag '$GITHUB_REF_NAME' is not a vX.Y.Z version tag."; exit 1 ;;
          esac
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            const conf = "crates/deepclean-app/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(conf, "utf8"));
            if (c.version !== v) {
              console.log(`::warning::tauri.conf.json says ${c.version} but the tag says ${v}; using ${v}. Bump the committed version before tagging.`);
            }
            c.version = v;
            fs.writeFileSync(conf, JSON.stringify(c, null, 2) + "\n");
            for (const f of ["crates/deepclean-core/Cargo.toml", "crates/deepclean-app/Cargo.toml"]) {
              fs.writeFileSync(f, fs.readFileSync(f, "utf8").replace(/^version = ".*"$/m, `version = "${v}"`));
            }
            console.log("Building version " + v);
          ' "$VERSION"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '${{ github.ref_name }}'
          releaseBody: 'See the [CHANGELOG](https://github.com/eladbash/void/blob/main/CHANGELOG.md) for details.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: crates/deepclean-app
