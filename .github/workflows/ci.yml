name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Tests build their own hermetic git repos; keep the runner's system git
  # config out of them.
  GIT_CONFIG_NOSYSTEM: 1
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: ./scripts/linux-deps.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Every crate on every desktop platform. The app's window tests run on
  # GPUI's headless test platform, so no GPU or display is needed.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: ./scripts/linux-deps.sh
      - run: cargo test --workspace

  # The minimum supported Rust version still builds everything.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: ./scripts/linux-deps.sh
      - run: cargo check --workspace --all-targets
