[package]
name = "deepclean-app"
version = "0.1.0"
edition = "2021"

[dependencies]
deepclean-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "void_app_lib"
path = "src/lib.rs"

[[bin]]
name = "void-app"
path = "src/main.rs"
