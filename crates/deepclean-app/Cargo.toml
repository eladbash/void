[package]
name = "deepclean-app"
version = "1.2.0"
edition = "2021"
rust-version.workspace = true
description = "Void cleans up after your AI agents — and your agents can call Void themselves."

[dependencies]
deepclean-core = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
sysinfo = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
gpui-kit = { version = "0.7", default-features = false, features = ["component"] }
futures = "0.3"
# ksni: the StatusNotifierItem D-Bus tray on Linux — no GTK event loop to
# host next to GPUI's. Its dependency is Linux-only, so this is a no-op elsewhere.
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
notify-rust = "4"
auto-launch = "0.6"
png = "0.17"

[dev-dependencies]
tempfile = "3"
gpui-kit = { version = "0.7", default-features = false, features = ["component", "test-support"] }

[lib]
name = "void_app_lib"
path = "src/lib.rs"

[[bin]]
name = "void-app"
path = "src/main.rs"

# Bundles for every platform: `cargo build --release -p deepclean-app`, then
# `cargo packager --release` from this directory: .app/.dmg on macOS, .deb/.AppImage on Linux, NSIS/.msi on Windows.
[package.metadata.packager]
product-name = "Void"
identifier = "com.void.app"
category = "DeveloperTool"
authors = ["Elad Bash"]
publisher = "Elad Bash"
homepage = "https://github.com/eladbash/void"
description = "Void cleans up after your AI agents — and your agents can call Void themselves."
long-description = "Void finds and cleans developer disk bloat across 15 ecosystems — agent worktrees, agent transcripts, local AI models and build artifacts. Everything runs locally."
binaries = [{ path = "void-app", main = true }]
icons = [
  "icons/32x32.png",
  "icons/128x128.png",
  "icons/128x128@2x.png",
  "icons/icon.icns",
  "icons/icon.ico",
]

[package.metadata.packager.macos]
minimum-system-version = "11.0"

[package.metadata.packager.deb]
depends = ["libxkbcommon0", "libxkbcommon-x11-0", "libvulkan1", "libfontconfig1", "libdbus-1-3"]
