[workspace]
members = ["crates/deepclean-core", "crates/deepclean-app"]
resolver = "2"

[workspace.package]
# Minimum supported Rust version. The binding constraint is sysinfo 0.39,
# which requires 1.95; our own code compiles on older toolchains.
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
ignore = "0.4"
sysinfo = "0.39"
bytesize = { version = "2", features = ["serde"] }
async-trait = "0.1"
dirs = "6"
deepclean-core = { path = "crates/deepclean-core" }
