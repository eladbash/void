  awkward cases: an unknown Docker size, a null mtime, and an item whose Safe
  default guards a Danger `rm -rf`.

  Serve the repository root and open /dev/harness.html, e.g.
      python3 -m http.server 8000
      open http://localhost:8000/dev/harness.html?theme=dark

  Query parameters:  theme=dark|light   goto=settings|history   scan=0

  CAVEAT: the fixture mirrors `deepclean-core::model` by hand and nothing in CI
  checks that. If you add or rename a field there, update it here too — this
  file will keep rendering happily against a stale shape.
-->
