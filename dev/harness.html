<!--
  Void — frontend development harness.  NOT part of the shipped app.

  Opens the real frontend in a plain browser with a stubbed Tauri bridge, so a
  CSS or layout change can be checked with a refresh instead of a full
  `cargo tauri dev` rebuild. The fixture below deliberately includes the
  awkward cases: an unknown Docker size, a null mtime, and an item whose Safe
  default guards a Danger `rm -rf`.

  Serve the repository root and open /dev/harness.html, e.g.
      python3 -m http.server 8000
      open http://localhost:8000/dev/harness.html?theme=dark

  Query parameters:  theme=dark|light   goto=agents|settings|history   scan=0
                     disk=low|critical   (Guard status fixture)

  CAVEAT: the fixture mirrors `deepclean-core::model` by hand and nothing in CI
  checks that. If you add or rename a field there, update it here too — this
  file will keep rendering happily against a stale shape.
-->

  dialog: { open: async () => '/Users/dev/NewFolder' },
};
const emit = (name, payload) => (handlers[name]||[]).forEach(cb => cb({ payload }));
function runScan() {
  ['worktrees','agent_data','models','rust','node','apple','docker','go','system','java','homebrew','projects'].forEach(e => emit('scan-event',{type:'scanner_started',ecosystem:e}));
  emit('scan-event',{type:'progress',message:'',paths_scanned:128431});
  ITEMS.forEach(item => emit('scan-event',{type:'item_found',item}));
  emit('scan-event',{type:'permission_denied',path:'/Users/dev/Library/Containers'});
  emit('scan-event',{type:'error',message:'docker: daemon not running'});
  emit('scan-event',{type:'scan_complete',summary:{scan_duration_ms:42100}});
}
// Drive the real scan path once the app has booted and registered listeners.
if (new URLSearchParams(location.search).get('scan') !== '0') {
  const tick = setInterval(() => {
    if (window.__void_scan) {
      clearInterval(tick);
      window.__void_scan();
      const goto = new URLSearchParams(location.search).get('goto');
      if (goto) setTimeout(() => document.querySelector(`[data-route="${goto}"]`)?.click(), 400);
    }
  }, 40);
}
